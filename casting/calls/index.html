  <style>
    :root {
      --border: rgba(240, 244, 255, 0.15);
      --text-dim: #8fa0bd;
      --text: #c8d4f0;
      --text-bright: #f0f4ff;
      --accent: #7eb8c9;
      --violet-deep: #1a0a2e;
      --pink: #ff2d78;
      --open: #ffb4cf;
      --filled: #ff5a72;
      --pg: #a8d5b5;
      --r: #f2a6a6;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --mono: 'Inconsolata', monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
      font-family: var(--serif);
      font-weight: 300;
      line-height: 1.7;
      color: var(--text);
      background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.03;
      pointer-events: none;
      z-index: 1000;
    }

    #background-container {
      position: fixed;
      inset: 0;
      z-index: 0;
      opacity: 0.15;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    .page-header {
      text-align: center;
      margin-bottom: 1rem;
    }

    .page-header h1 {
      color: var(--text-bright);
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      line-height: 1.1;
      letter-spacing: 0.02em;
    }

    .nav-buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.6rem;
      padding: 1.5rem 0;
      flex-wrap: wrap;
    }

    .nav-buttons.bottom-nav { padding: 2rem 0 0; }

    .nav-button {
      min-width: 45px;
      height: 45px;
      padding: 0 0.85rem;
      border: 2px solid var(--text-bright);
      border-radius: 999px;
      background: transparent;
      color: var(--text-bright);
      display: inline-flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      text-decoration: none;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      white-space: nowrap;
      transition: all 0.25s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible {
      background: var(--text-bright);
      color: var(--violet-deep);
      transform: scale(1.05);
      outline: none;
    }

    .nav-button.pink-room { color: var(--pink); border-color: var(--pink); }
    .nav-button.pink-room:hover,
    .nav-button.pink-room:focus-visible { background: var(--pink); color: #fff; }

    .nav-button.two-line {
      flex-direction: column;
      gap: 0.05rem;
      height: auto;
      min-height: 45px;
      padding: 0.4rem 0.7rem;
      border-radius: 14px;
      line-height: 1.15;
    }

    .search-card,
    .info-section,
    .casting-call {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(255,255,255,0.055);
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }

    .search-card {
      padding: 1rem;
      margin-bottom: 1rem;
    }

    .search-label {
      display: block;
      margin-bottom: 0.45rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 0.78rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: rgba(0,0,0,0.2);
      color: var(--text-bright);
      font-family: var(--serif);
      font-size: 1.05rem;
      outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }

    input::placeholder,
    textarea::placeholder { color: rgba(240,244,255,0.38); }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: rgba(240,244,255,0.6);
      background: rgba(0,0,0,0.28);
    }

    select option,
    select optgroup { color: #000; background: #fff; }

    .search-status {
      min-height: 1.25rem;
      padding-top: 0.4rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--text-dim);
    }

    .sections {
      display: grid;
      gap: 1rem;
    }

    details.info-section,
    details.casting-call {
      overflow: hidden;
    }

    details.info-section > summary,
    details.casting-call > summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 1rem 1.2rem;
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      user-select: none;
    }

    details.info-section > summary::-webkit-details-marker,
    details.casting-call > summary::-webkit-details-marker { display: none; }

    details.info-section > summary::after,
    details.casting-call > summary::after {
      content: '+';
      font-family: var(--serif);
      font-size: 1.35rem;
      line-height: 1;
      flex-shrink: 0;
    }

    details.info-section[open] > summary::after,
    details.casting-call[open] > summary::after { content: '\2212'; }

    details.info-section > summary:hover,
    details.info-section > summary:focus-visible,
    details.casting-call > summary:hover,
    details.casting-call > summary:focus-visible {
      color: var(--accent);
      outline: none;
    }

    .details-body {
      padding: 0 1.2rem 1.3rem;
    }

    .audition-lead {
      color: var(--text-bright);
      margin-bottom: 1rem;
    }

    .guidelines-link {
      display: inline-block;
      margin-bottom: 1rem;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.76rem;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .guidelines-link:hover,
    .guidelines-link:focus-visible { color: var(--text-bright); outline: none; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .form-row.full { grid-column: 1 / -1; }

    label,
    legend {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-bright);
    }

    fieldset { border: 0; }

    .choice-list {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .choice {
      display: flex;
      align-items: flex-start;
      gap: 0.55rem;
      font-family: var(--serif);
      font-size: 1rem;
      letter-spacing: normal;
      line-height: 1.45;
      text-transform: none;
      color: var(--text-bright);
    }

    .choice input {
      width: auto;
      margin-top: 0.28rem;
      flex-shrink: 0;
    }

    .field-note {
      font-size: 0.88rem;
      line-height: 1.45;
      color: var(--text-bright);
    }

    .submit-row {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 0.5rem;
    }

    .submit-button {
      min-width: 150px;
      height: 45px;
      padding: 0 1.2rem;
      border: 2px solid var(--text-bright);
      border-radius: 999px;
      background: transparent;
      color: var(--text-bright);
      cursor: pointer;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: var(--text-bright);
      color: var(--violet-deep);
      outline: none;
    }

    .submit-button[disabled] { cursor: wait; opacity: 0.55; }

    .form-status {
      font-family: var(--mono);
      min-height: 1.4rem;
      font-size: 0.85rem;
      line-height: 1.5;
      color: var(--text-bright);
    }

    .form-status.success { color: #a8d5b5; }
    .form-status.error { color: #d5b8a8; }

    .screen-reader-trap {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      overflow: hidden;
      opacity: 0;
    }

    .call-meta {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.6rem 1rem;
      margin-bottom: 1rem;
      padding: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(0,0,0,0.13);
    }

    .meta-item strong {
      display: block;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .meta-item span,
    .meta-item time { color: var(--text-bright); }

    .status-badge,
    .heat-badge,
    .spotlight-badge {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      line-height: 1;
      white-space: nowrap;
    }

    .status-badge.open { border: 1px solid var(--open); color: var(--open); }
    .status-badge.filled { border: 1px solid var(--filled); color: var(--filled); }
    .heat-badge.pg { border: 1px solid var(--pg); color: var(--pg); }
    .heat-badge.r { border: 1px solid var(--r); color: var(--r); }
    .spotlight-badge { border: 1px solid var(--accent); color: var(--accent); }

    .heat-key {
      margin: 0 0 1rem;
      padding: 0.8rem;
      border-left: 2px solid var(--border);
      color: var(--text-bright);
      font-size: 0.95rem;
    }

    .heat-key p + p { margin-top: 0.35rem; }

    .call-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .call-links a {
      color: var(--accent);
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-decoration: none;
    }

    .call-links a:hover,
    .call-links a:focus-visible { color: var(--text-bright); outline: none; }

    .role-section-title {
      margin: 1.2rem 0 0.55rem;
      padding-bottom: 0.35rem;
      border-bottom: 1px solid var(--border);
      color: var(--text-bright);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 400;
    }

    .role-list {
      display: grid;
      gap: 0.65rem;
    }

    .role-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(0,0,0,0.12);
      padding: 0.85rem 0.95rem;
    }

    .role-card[hidden],
    .casting-call[hidden] { display: none !important; }

    .role-topline {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.8rem;
      margin-bottom: 0.35rem;
    }

    .role-name {
      color: var(--text-bright);
      font-size: 1.25rem;
      line-height: 1.2;
      font-weight: 400;
    }

    .role-label {
      color: var(--accent);
      font-size: 0.98rem;
    }

    .role-badges {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 0.35rem;
    }

    .role-description {
      margin-top: 0.45rem;
      color: var(--text-bright);
    }

    .role-specs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 1rem;
      margin-top: 0.55rem;
      color: var(--text-dim);
      font-family: var(--mono);
      font-size: 0.72rem;
    }

    .role-specs strong {
      color: var(--text-bright);
      font-weight: 400;
    }

    .empty-state {
      padding: 1.2rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-bright);
      text-align: center;
    }

    .footer-credit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
    }

    .footer-credit a { color: var(--accent); text-decoration: none; }
    .footer-credit a:hover { color: var(--text-bright); }

    @media (max-width: 700px) {
      .form-grid,
      .call-meta { grid-template-columns: 1fr; }
      .form-row.full,
      .submit-row { grid-column: auto; }
      .role-topline { flex-direction: column; }
      .role-badges { justify-content: flex-start; }
    }

    @media (max-width: 600px) {
      main { padding: 2rem 1rem; }
      .nav-button { min-width: 40px; height: 40px; padding: 0 0.65rem; }
    }
  </style>
</head>
<body>

<div id="background-container"></div>

<main>
  <header class="page-header">
    <h1>CASTING CALLS</h1>
  </header>

  <nav class="nav-buttons" aria-label="Site navigation">
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/neuralpedia/new-releases/" aria-label="New Releases">NEW</a>
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/neuralpedia/" aria-label="Neuralpedia">NP</a>
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/neuralpedia/chronology/page-1/" aria-label="Chronological Archive">CHRON</a>
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/scripts/" aria-label="Scripts and Scriptbooks">SCRIPTS</a>
    <a class="nav-button two-line" href="https://neuralnetsandprettypatterns.com/deepdreamstate/" aria-label="Deep Dream State Podcast"><span>DDS</span><span>POD</span></a>
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/deep-drop-party/" aria-label="Deep Drop Party">DDP</a>
    <a class="nav-button pink-room" href="https://neuralnetsandprettypatterns.com/the-pink-room/" aria-label="The Pink Room">TPR</a>
    <a class="nav-button" href="https://neuralnetsandprettypatterns.com/" aria-label="Home">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 11.5 12 4l9 7.5" />
        <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" />
      </svg>
    </a>
  </nav>

  <section class="search-card" aria-label="Search casting calls">
    <label class="search-label" for="casting-search">Search casting calls</label>
    <input id="casting-search" type="search" autocomplete="off" placeholder="Search project, character, role, series, subject, gender, heat...">
    <p id="search-status" class="search-status" aria-live="polite"></p>
  </section>

  <section class="sections" aria-label="Auditions and casting calls">
    <details class="info-section" id="audition">
      <summary>AUDITION</summary>
      <div class="details-body">
        <p class="audition-lead">Use this form to audition for a current casting call.</p>
        <a class="guidelines-link" href="https://neuralnetsandprettypatterns.com/casting/general/">GENERAL CASTING GUIDELINES</a>

        <form id="audition-form" action="/api/contact" method="POST" novalidate>
          <div class="form-grid">
            <div class="form-row">
              <label for="name">Stage name</label>
              <input id="name" name="name" type="text" maxlength="120" placeholder="Stage name" required>
            </div>

            <div class="form-row">
              <label for="email">What email should we use?</label>
              <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
            </div>

            <div class="form-row">
              <label for="audition-call">Casting call</label>
              <select id="audition-call" name="audition_call" required>
                <option value="">Choose a casting call</option>
                <!--CASTING_CALL_OPTIONS_SSR-->
              </select>
            </div>

            <div class="form-row">
              <label for="audition-role">Role</label>
              <select id="audition-role" name="audition_role" required>
                <option value="">Choose a role</option>
                <!--CASTING_ROLE_OPTIONS_SSR-->
              </select>
            </div>

            <div class="form-row full">
              <label for="demo-link">Demo link</label>
              <input id="demo-link" name="demo_link" type="url" maxlength="500" placeholder="https://..." required>
            </div>

            <div class="form-row full">
              <label for="audition-links">Public links</label>
              <input id="audition-links" name="audition_links" type="text" maxlength="500" placeholder="Website, social, credits, link hub" required>
            </div>

            <div class="form-row full">
              <label for="voice-notes">Voice / range notes <span style="text-transform:none;letter-spacing:normal;">(optional)</span></label>
              <input id="voice-notes" name="voice_notes" type="text" maxlength="300" placeholder="Tone, accent, range, comfort zone">
            </div>

            <div class="form-row full">
              <label for="audition-notes">Other relevant info <span style="text-transform:none;letter-spacing:normal;">(optional)</span></label>
              <textarea id="audition-notes" rows="5" maxlength="2500" placeholder="Anything useful for this audition"></textarea>
            </div>

            <fieldset class="form-row full">
              <legend>Age</legend>
              <div class="choice-list">
                <label class="choice" for="affirm-over-18">
                  <input id="affirm-over-18" name="affirm_over_18" type="checkbox" value="Yes" required>
                  <span>I affirm that I am over the age of 18.</span>
                </label>
                <label class="choice" for="affirm-legal">
                  <input id="affirm-legal" name="affirm_legal" type="checkbox" value="Yes">
                  <span>I affirm that I am legally permitted to participate in adult voice performance in my jurisdiction.</span>
                </label>
              </div>
            </fieldset>

            <div class="screen-reader-trap" aria-hidden="true">
              <label for="company-url">Company URL</label>
              <input id="company-url" name="company_url" type="text" tabindex="-1" autocomplete="off">
            </div>

            <input type="hidden" name="category" value="voice-auditions">
            <input type="hidden" name="message" id="audition-message" value="Casting call audition">

            <div class="submit-row">
              <button class="submit-button" id="submit-button" type="submit">Send audition</button>
              <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
            </div>
          </div>
        </form>
      </div>
    </details>

    <div id="casting-calls">
      <!--CASTING_CALLS_SSR-->
    </div>

    <div id="no-results" class="empty-state" hidden>No casting calls match that search.</div>

<script>
  const searchInput = document.getElementById('casting-search');
  const searchStatus = document.getElementById('search-status');
  const noResults = document.getElementById('no-results');

  function normalizeSearchText(value) {
    return String(value || '')
      .toLowerCase()
      .replace(/\s+/g, ' ')
      .trim();
  }

  function applyCastingSearch() {
    const query = normalizeSearchText(searchInput.value);
    const calls = Array.from(document.querySelectorAll('.casting-call'));
    let visibleCalls = 0;
    let visibleRoles = 0;

    calls.forEach(call => {
      const roles = Array.from(call.querySelectorAll('.role-card'));
      const callSearch = normalizeSearchText(call.dataset.search || call.textContent);
      const callMatches = !query || callSearch.includes(query);
      let matchingRoles = 0;

      roles.forEach(role => {
        const roleSearch = normalizeSearchText(role.dataset.search || role.textContent);
        const roleMatches = !query || callMatches || roleSearch.includes(query);
        role.hidden = !roleMatches;
        if (roleMatches) matchingRoles += 1;
      });

      const showCall = !query || callMatches || matchingRoles > 0;
      call.hidden = !showCall;

      if (showCall) {
        visibleCalls += 1;
        visibleRoles += roles.filter(role => !role.hidden).length;
        if (query) call.open = true;
      }
    });

    noResults.hidden = visibleCalls !== 0 || !query;

    if (!query) {
      searchStatus.textContent = '';
    } else if (visibleCalls === 0) {
      searchStatus.textContent = '0 matches';
    } else {
      searchStatus.textContent = `${visibleCalls} call${visibleCalls === 1 ? '' : 's'}, ${visibleRoles} role${visibleRoles === 1 ? '' : 's'}`;
    }
  }

  searchInput.addEventListener('input', applyCastingSearch);

  const form = document.getElementById('audition-form');
  const statusEl = document.getElementById('form-status');
  const submitButton = document.getElementById('submit-button');
  const messageField = document.getElementById('audition-message');
  const auditionNotes = document.getElementById('audition-notes');
  const callSelect = document.getElementById('audition-call');
  const roleSelect = document.getElementById('audition-role');


  async function addVoiceActors() {
    const roleCards = Array.from(document.querySelectorAll('.role-card'));

    function setVA(card, value) {
      const specs = card.querySelector('.role-specs');
      if (!specs || specs.querySelector('.va-spec')) return;

      const va = document.createElement('span');
      va.className = 'va-spec';

      const label = document.createElement('strong');
      label.textContent = 'VA:';

      va.appendChild(label);
      va.appendChild(document.createTextNode(` ${value || 'OPEN'}`));

      const heatSpec = Array.from(specs.querySelectorAll('span')).find(span =>
        span.textContent.trim().toLowerCase().startsWith('heat:')
      );

      if (heatSpec) {
        heatSpec.insertAdjacentElement('afterend', va);
      } else {
        specs.appendChild(va);
      }
    }

    try {
      const response = await fetch('/api/casting/calls', {
        headers: { 'Accept': 'application/json' }
      });

      if (!response.ok) throw new Error('Casting data unavailable');

      const data = await response.json();
      const calls = Array.isArray(data.calls) ? data.calls : [];
      const roles = Array.isArray(data.roles) ? data.roles : [];

      document.querySelectorAll('.casting-call').forEach(callElement => {
        const displayedTitle =
          callElement.querySelector('summary span')?.textContent?.trim() || '';

        const call = calls.find(item => {
          const apiTitle = [
            item.series,
            item.series_title || item.title
          ].filter(Boolean).join(' : ');

          return apiTitle === displayedTitle;
        });

        callElement.querySelectorAll('.role-card').forEach(card => {
          const characterName =
            card.querySelector('.role-name')?.textContent?.trim() || '';

          const role = call
            ? roles.find(item =>
                Number(item.casting_call_id) === Number(call.id) &&
                String(item.character_name || '').trim() === characterName
              )
            : null;

          setVA(card, role?.actor_name || 'OPEN');
        });
      });
    } catch (error) {
      roleCards.forEach(card => setVA(card, 'OPEN'));
    }
  }

  addVoiceActors();

  function setStatus(message, type) {
    statusEl.textContent = message || '';
    statusEl.className = type ? `form-status ${type}` : 'form-status';
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    setStatus('', '');

    if (!form.reportValidity()) return;

    const callText = callSelect.options[callSelect.selectedIndex]?.textContent?.trim() || callSelect.value;
    const roleText = roleSelect.options[roleSelect.selectedIndex]?.textContent?.trim() || roleSelect.value;
    const extra = auditionNotes.value.trim();

    messageField.value = [
      'Casting call audition',
      `Call: ${callText}`,
      `Role: ${roleText}`,
      extra ? `Notes: ${extra}` : ''
    ].filter(Boolean).join('\n');

    submitButton.disabled = true;
    submitButton.textContent = 'Sending';

    try {
      const formData = new FormData(form);
      const response = await fetch(form.action, {
        method: 'POST',
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      let payload = {};
      try {
        payload = await response.json();
      } catch (err) {
        payload = {};
      }

      if (!response.ok || !payload.ok) {
        throw new Error(payload.error || 'Audition could not be sent.');
      }

      form.reset();
      messageField.value = 'Casting call audition';
      setStatus('Sent.', 'success');
    } catch (err) {
      setStatus(err.message || 'Audition could not be sent.', 'error');
    } finally {
      submitButton.disabled = false;
      submitButton.textContent = 'Send audition';
    }
  });
</script>
