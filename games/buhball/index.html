<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buh Ball | Neural Nets and Pretty Patterns</title>

  <meta
    name="description"
    content="Buh Ball is a very serious game about turning language into buhbuh."
  >


  <link
    rel="icon"
    type="image/png"
    href="https://neuralnetsandprettypatterns.com/favicon-transparent.png"
  >
  <link
    rel="shortcut icon"
    type="image/png"
    href="https://neuralnetsandprettypatterns.com/favicon-transparent.png"
  >
  <link
    rel="apple-touch-icon"
    href="https://neuralnetsandprettypatterns.com/favicon-transparent.png"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --ink: #251542;
      --cream: #fff9d9;
      --pink: #ff4fc8;
      --yellow: #ffe845;
      --cyan: #42e8ff;
      --purple: #a85cff;
      --green: #62ff8f;
      --orange: #ff963d;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);

      background:
        radial-gradient(circle at 15% 20%, #ffe845 0 8%, transparent 9%),
        radial-gradient(circle at 85% 25%, #42e8ff 0 7%, transparent 8%),
        radial-gradient(circle at 20% 85%, #ff4fc8 0 8%, transparent 9%),
        radial-gradient(circle at 82% 82%, #62ff8f 0 8%, transparent 9%),
        linear-gradient(135deg, #ff88dc, #ffe985, #71efff);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .game-shell {
      width: min(720px, 100%);
      background: var(--cream);
      border: 6px solid var(--ink);
      border-radius: 28px;
      box-shadow:
        10px 10px 0 var(--ink),
        18px 18px 0 rgba(255, 79, 200, 0.45);

      padding: 26px;
      position: relative;
      overflow: hidden;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(3rem, 10vw, 6rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      transform: rotate(-2deg);
      text-shadow:
        4px 4px 0 var(--yellow),
        7px 7px 0 var(--pink);
    }

    .subtitle {
      text-align: center;
      margin: 18px 0 24px;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .score-box {
      background: white;
      border: 4px solid var(--ink);
      border-radius: 16px;
      padding: 10px;
      text-align: center;
      font-weight: 900;
      box-shadow: 4px 4px 0 var(--ink);
    }

    .score-label {
      display: block;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .score-value {
      display: block;
      font-size: 1.6rem;
    }

    .timer-danger {
      background: #ff6969;
      animation: timerPulse 0.45s infinite alternate;
    }

    @keyframes timerPulse {
      from {
        transform: scale(1);
      }
      to {
        transform: scale(1.05);
      }
    }

    .panel {
      background: white;
      border: 4px solid var(--ink);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 5px 5px 0 var(--ink);
    }

    label {
      display: block;
      font-size: 1.1rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 1.15rem;
      border: 4px solid var(--ink);
      border-radius: 13px;
      padding: 14px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    input:focus {
      box-shadow: 0 0 0 5px var(--cyan);
    }

    button {
      width: 100%;
      margin-top: 14px;
      border: 4px solid var(--ink);
      border-radius: 14px;
      padding: 13px 18px;

      font: inherit;
      font-weight: 1000;
      font-size: 1.15rem;

      background: var(--yellow);
      color: var(--ink);

      cursor: pointer;

      box-shadow: 5px 5px 0 var(--ink);

      transition:
        transform 0.08s ease,
        box-shadow 0.08s ease;
    }

    button:hover {
      background: var(--cyan);
    }

    button:active {
      transform: translate(5px, 5px);
      box-shadow: 0 0 0 var(--ink);
    }

    .challenge-label {
      text-align: center;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
    }

    .challenge {
      margin: 12px 0 24px;
      text-align: center;
      font-size: clamp(2rem, 7vw, 4rem);
      line-height: 1.08;
      font-weight: 1000;
      word-break: break-word;
      color: var(--purple);
      text-shadow: 3px 3px 0 var(--yellow);
    }

    .hidden {
      display: none;
    }

    .message {
      min-height: 34px;
      margin: 18px 0 0;
      text-align: center;
      font-size: 1.2rem;
      font-weight: 1000;
    }

    .oopsie {
      color: #d00048;
      font-size: clamp(1.3rem, 4vw, 2rem);
      animation: wobble 0.18s alternate 4;
    }

    @keyframes wobble {
      from {
        transform: rotate(-2deg);
      }
      to {
        transform: rotate(2deg);
      }
    }

    .brainbow {
      position: fixed;
      inset: 0;
      z-index: 100;

      display: flex;
      align-items: center;
      justify-content: center;

      pointer-events: none;

      font-weight: 1000;
      font-size: clamp(3.5rem, 13vw, 9rem);
      letter-spacing: -0.05em;

      background: rgba(255,255,255,0.22);

      animation:
        brainbowPop 1.15s ease forwards;
    }

    .brainbow span {
      background: linear-gradient(
        90deg,
        #ff384f,
        #ff9738,
        #ffe338,
        #45e76d,
        #3fddff,
        #7555ff,
        #ff46c8
      );

      background-size: 300% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;

      -webkit-text-stroke: 3px var(--ink);

      animation: rainbowMove 0.4s linear infinite;
    }

    @keyframes rainbowMove {
      from {
        background-position: 0% 50%;
      }
      to {
        background-position: 100% 50%;
      }
    }

    @keyframes brainbowPop {
      0% {
        opacity: 0;
        transform: scale(0.1) rotate(-12deg);
      }

      25% {
        opacity: 1;
        transform: scale(1.15) rotate(5deg);
      }

      55% {
        transform: scale(0.95) rotate(-2deg);
      }

      80% {
        opacity: 1;
        transform: scale(1.04);
      }

      100% {
        opacity: 0;
        transform: scale(1.5);
      }
    }

    .instructions {
      margin-top: 20px;
      text-align: center;
      font-size: 0.85rem;
      line-height: 1.4;
      font-weight: 700;
    }

    @media (max-width: 520px) {
      .game-shell {
        padding: 18px;
        border-width: 4px;
        box-shadow: 6px 6px 0 var(--ink);
      }

      .scoreboard {
        gap: 6px;
      }

      .score-box {
        border-width: 3px;
        padding: 8px 4px;
      }

      .score-value {
        font-size: 1.3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>

  <main class="game-shell">

    <h1>BUH BALL</h1>

    <div class="subtitle">
      TURN THOUGHT INTO BUH
    </div>

    <div class="scoreboard">

      <div class="score-box">
        <span class="score-label">Score</span>
        <span class="score-value" id="score">0</span>
      </div>

      <div class="score-box">
        <span class="score-label">Best</span>
        <span class="score-value" id="bestScore">0</span>
      </div>

      <div class="score-box" id="timerBox">
        <span class="score-label">Seconds</span>
        <span class="score-value" id="timer">15</span>
      </div>

    </div>

    <!-- STATEMENT ENTRY -->

    <section class="panel" id="statementPanel">

      <form id="statementForm">

        <label for="statementInput">
          SAY SOMETHING
        </label>

        <input
          id="statementInput"
          type="text"
          minlength="5"
          maxlength="150"
          autocomplete="off"
          spellcheck="false"
          placeholder="Type at least five characters..."
          required
        >

        <button type="submit">
          BUH IT
        </button>

      </form>

    </section>

    <!-- BUH CHALLENGE -->

    <section class="panel hidden" id="challengePanel">

      <div class="challenge-label">
        TYPE THE BUH BUH
      </div>

      <div class="challenge" id="challengeText">
        buh buh
      </div>

      <form id="answerForm">

        <label for="answerInput">
          BUH BACK
        </label>

        <input
          id="answerInput"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          required
        >

        <button type="submit">
          BUH!
        </button>

      </form>

    </section>

    <div
      class="message"
      id="message"
      aria-live="polite"
    ></div>

    <div class="instructions">
      You have 15 seconds. Match the buh exactly enough.
      Capitalization and extra spaces don't matter.
    </div>

  </main>


  <script>
    (() => {

      const BUH_ENDINGS = [
        "oo",
        "uh",
        "um",
        "im",
        "ow"
      ];


      /*
      --------------------------------
      FILLER SPEECH

      One source word becomes one short
      generated word. Then exactly one
      single-word filler is inserted.
      --------------------------------
      */

      const FILLER_WORDS = [
        "like",
        "totally",
        "whatever",
        "literally",
        "ohmygawd"
      ];

      const statementPanel =
        document.getElementById("statementPanel");

      const challengePanel =
        document.getElementById("challengePanel");

      const statementForm =
        document.getElementById("statementForm");

      const answerForm =
        document.getElementById("answerForm");

      const statementInput =
        document.getElementById("statementInput");

      const answerInput =
        document.getElementById("answerInput");

      const challengeText =
        document.getElementById("challengeText");

      const scoreElement =
        document.getElementById("score");

      const bestScoreElement =
        document.getElementById("bestScore");

      const timerElement =
        document.getElementById("timer");

      const timerBox =
        document.getElementById("timerBox");

      const message =
        document.getElementById("message");


      let score = 0;

      let bestScore =
        Number(localStorage.getItem("buhBallBest")) || 0;

      let currentChallenge = "";

      let secondsRemaining = 15;

      let timerInterval = null;

      let roundActive = false;


      bestScoreElement.textContent = bestScore;


      /*
      --------------------------------
      TEXT NORMALIZATION
      --------------------------------
      */

      function normalizeAnswer(text) {

        return text
          .toLowerCase()
          .trim()
          .replace(/\s+/g, " ");

      }


      /*
      --------------------------------
      RANDOM HELPERS
      --------------------------------
      */

      function randomEnding() {

        return BUH_ENDINGS[
          Math.floor(Math.random() * BUH_ENDINGS.length)
        ];

      }


      function randomInteger(min, max) {

        return Math.floor(
          Math.random() * (max - min + 1)
        ) + min;

      }


      function randomChoice(items) {

        return items[
          Math.floor(Math.random() * items.length)
        ];

      }


      /*
      --------------------------------
      BASIC WORD CLEANUP
      --------------------------------
      */

      function cleanWord(word) {

        return word
          .toLowerCase()
          .replace(/[^a-z']/g, "");

      }


      /*
      --------------------------------
      SIMPLE CONSONANT SOUND

      One source word now makes exactly
      one short buh-word.

      This deliberately avoids the old
      syllable expansion, so the first
      pass has the SAME word count as
      the user's sentence.
      --------------------------------
      */

      function simplifyConsonants(chunk) {

        chunk = chunk
          .replace(/[^a-z]/g, "")
          .replace(/(.)\1+/g, "$1");


        const sounds = [
          "th",
          "sh",
          "ch",
          "ph",
          "wh",
          "qu",
          "br",
          "bl",
          "cr",
          "cl",
          "dr",
          "fl",
          "fr",
          "gl",
          "gr",
          "pl",
          "pr",
          "sk",
          "sl",
          "sm",
          "sn",
          "sp",
          "st",
          "sw",
          "tr"
        ];


        for (const sound of sounds) {

          if (chunk.startsWith(sound)) {
            return sound;
          }

        }


        return chunk.charAt(0) || "b";

      }


      function getConsonantSound(word) {

        const lower =
          cleanWord(word);


        if (!lower) {
          return "b";
        }


        const opening =
          lower.match(/^[^aeiouy]+/);


        if (opening) {

          return simplifyConsonants(
            opening[0]
          );

        }


        /*
        If the word starts with a vowel,
        grab the first consonant later in
        the word. Pure vowel noise gets b.
        */

        const internal =
          lower.match(/[^aeiouy]+/);


        if (internal) {

          return simplifyConsonants(
            internal[0]
          );

        }


        return "b";

      }


      function buhWord(word) {

        return (
          getConsonantSound(word) +
          randomEnding()
        );

      }


      /*
      --------------------------------
      WORD / FILLER HANDLING
      --------------------------------
      */

      function wordsFromStatement(statement) {

        return (
          statement.match(/[A-Za-z']+/g) ||
          []
        );

      }


      function insertOneFiller(words) {

        const output =
          [...words];

        const filler =
          randomChoice(FILLER_WORDS);

        const position =
          randomInteger(
            0,
            output.length
          );

        output.splice(
          position,
          0,
          filler
        );

        return output;

      }


      /*
      --------------------------------
      ONE EXCLAMATION POINT

      Exactly one exclamation point is
      added at a random position. If the
      tenth word becomes terminal "um",
      the exclamation stays before it so
      that word remains exactly "um".
      --------------------------------
      */

      function addOneExclamation(words) {

        if (words.length === 0) {
          return words;
        }

        const output =
          [...words];

        let lastEligibleIndex =
          output.length - 1;

        if (
          output.length >= 10 &&
          output[9] === "um"
        ) {
          lastEligibleIndex = 8;
        }

        const index =
          randomInteger(
            0,
            Math.max(0, lastEligibleIndex)
          );

        output[index] =
          output[index]
            .replace(/[.!?]+$/g, "") +
          "!";

        return output;

      }


      /*
      --------------------------------
      CONVERT FULL STATEMENT

      1. One source word = one short word.
      2. Add exactly one filler word.
      3. Total words = source words + 1.
      4. Add exactly one exclamation point.
      5. If the result reaches ten words,
         word ten becomes exactly "um" and
         the utterance stops there.
      --------------------------------
      */

      function buhify(statement) {

        const sourceWords =
          wordsFromStatement(statement);

        if (sourceWords.length === 0) {
          return "";
        }


        const simplifiedWords =
          sourceWords.map(buhWord);


        let output =
          insertOneFiller(
            simplifiedWords
          );


        /*
        Ten words or more:
        word ten is exactly "um",
        and speech stops there.
        */

        if (output.length >= 10) {

          output =
            output.slice(0, 10);

          output[9] = "um";

        }


        output =
          addOneExclamation(output);


        return output.join(" ");

      }


      /*
      --------------------------------
      TIMER
      --------------------------------
      */

      function startTimer() {

        stopTimer();

        secondsRemaining = 15;

        timerElement.textContent =
          secondsRemaining;

        timerBox.classList.remove(
          "timer-danger"
        );


        timerInterval = setInterval(() => {

          secondsRemaining--;

          timerElement.textContent =
            secondsRemaining;


          if (secondsRemaining <= 5) {

            timerBox.classList.add(
              "timer-danger"
            );

          }


          if (secondsRemaining <= 0) {

            failRound();

          }

        }, 1000);

      }


      function stopTimer() {

        if (timerInterval) {

          clearInterval(timerInterval);

          timerInterval = null;

        }

      }


      /*
      --------------------------------
      START ROUND
      --------------------------------
      */

      function startRound(statement) {

        currentChallenge =
          buhify(statement);

        challengeText.textContent =
          currentChallenge;

        statementPanel.classList.add(
          "hidden"
        );

        challengePanel.classList.remove(
          "hidden"
        );

        message.textContent = "";

        answerInput.value = "";

        roundActive = true;

        startTimer();

        answerInput.focus();

      }


      /*
      --------------------------------
      CORRECT
      --------------------------------
      */

      function winRound() {

        if (!roundActive) {
          return;
        }

        roundActive = false;

        stopTimer();


        score++;

        scoreElement.textContent = score;


        if (score > bestScore) {

          bestScore = score;

          bestScoreElement.textContent =
            bestScore;

          localStorage.setItem(
            "buhBallBest",
            String(bestScore)
          );

        }


        showBrainbow();


        setTimeout(() => {

          resetForNextStatement();

        }, 1000);

      }


      /*
      --------------------------------
      FAILURE
      --------------------------------
      */

      function failRound() {

        if (!roundActive) {
          return;
        }

        roundActive = false;

        stopTimer();

        score = 0;

        scoreElement.textContent = "0";

        message.textContent =
          "OOPSIE - GOTTA BUH BUH BETTER";

        message.className =
          "message oopsie";

        challengePanel.classList.add(
          "hidden"
        );

        statementPanel.classList.remove(
          "hidden"
        );

        timerElement.textContent = "15";

        timerBox.classList.remove(
          "timer-danger"
        );

        statementInput.value = "";

        statementInput.focus();

      }


      /*
      --------------------------------
      RESET AFTER WIN
      --------------------------------
      */

      function resetForNextStatement() {

        challengePanel.classList.add(
          "hidden"
        );

        statementPanel.classList.remove(
          "hidden"
        );

        message.textContent = "";

        message.className = "message";

        timerElement.textContent = "15";

        timerBox.classList.remove(
          "timer-danger"
        );

        statementInput.value = "";

        statementInput.focus();

      }


      /*
      --------------------------------
      BRAINBOW
      --------------------------------
      */

      function showBrainbow() {

        const brainbow =
          document.createElement("div");

        brainbow.className =
          "brainbow";

        brainbow.innerHTML =
          "<span>BRAINBOW!</span>";

        document.body.appendChild(
          brainbow
        );


        setTimeout(() => {

          brainbow.remove();

        }, 1200);

      }


      /*
      --------------------------------
      FORM EVENTS
      --------------------------------
      */

      statementForm.addEventListener(
        "submit",
        event => {

          event.preventDefault();

          const statement =
            statementInput.value.trim();


          if (statement.length < 5) {
            return;
          }


          startRound(statement);

        }
      );


      answerForm.addEventListener(
        "submit",
        event => {

          event.preventDefault();


          if (!roundActive) {
            return;
          }


          const answer =
            normalizeAnswer(
              answerInput.value
            );

          const correct =
            normalizeAnswer(
              currentChallenge
            );


          if (answer === correct) {

            winRound();

          } else {

            failRound();

          }

        }
      );


      statementInput.focus();

    })();
  </script>

</body>
</html>
